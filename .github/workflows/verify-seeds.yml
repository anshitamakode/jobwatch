name: verify-seeds

# Temporary: verifies the ATS guesses in the LinkedIn digest block of
# seed-urls.txt against the live feeds. Runners have the open network access
# that a sandboxed session does not. Manual trigger only; commits nothing.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Verify the new seed URLs
        run: |
          sed -n '/From the LinkedIn/,$p' seed-urls.txt > /tmp/new-seeds.txt
          echo "Candidates:"
          sed 's/#.*//' /tmp/new-seeds.txt | grep -c '^https' || true
          ./bootstrap.sh /tmp/new-seeds.txt

      - name: Which ones landed
        if: always()
        run: |
          echo "=== companies.yaml entries added by this run ==="
          git diff --no-color -- companies.yaml || true
