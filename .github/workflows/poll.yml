name: jobwatch

on:
  schedule:
    # Every two hours. A full scan of ~13k postings across 79 companies takes
    # ~6 min on GitHub's runners; two-hourly keeps this inside the free
    # 2,000 min/month Actions quota with headroom.
    - cron: "0 */4 * * *"
  workflow_dispatch: {}

# Only one run at a time, otherwise two runs can both see the same job as new
# and you get duplicate alerts plus a git push conflict.
concurrency:
  group: jobwatch-poll
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Poll
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
        run: python -m jobwatch poll --quiet

      - name: Commit state
        run: |
          git config user.name  "jobwatch-bot"
          git config user.email "actions@github.com"
          git add state/seen.json
          if git diff --staged --quiet; then
            echo "No state change."
          else
            git commit -m "state: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          fi